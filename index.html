
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TurkishAI - Yapay Zekâ Asistanı</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #101827;
  color: white;
  min-height: 100vh;
}

header {
  height: 75px;
  padding: 0 6%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid #29364a;
}

.logo {
  color: #62d6c5;
  font-size: 27px;
  font-weight: bold;
}

.header-right {
  display: flex;
  gap: 10px;
}

button, select, input {
  border: none;
  border-radius: 10px;
  padding: 13px;
  font-size: 15px;
}

select {
  background: #293b55;
  color: white;
  cursor: pointer;
}

button {
  background: #62d6c5;
  color: #10202a;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  opacity: 0.85;
}

.new-chat {
  background: #293b55;
  color: white;
}

main {
  width: 100%;
  max-width: 850px;
  margin: 45px auto;
  padding: 20px;
}

h1 {
  text-align: center;
  font-size: 35px;
}

.subtitle {
  text-align: center;
  color: #aab8cc;
}

.chat-container {
  background: #1b2940;
  border-radius: 18px;
  padding: 20px;
  margin-top: 30px;
}

#chat {
  height: 390px;
  overflow-y: auto;
  padding: 5px;
}

.message {
  background: #293b55;
  padding: 14px;
  border-radius: 12px;
  margin: 12px 0;
  line-height: 1.6;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.user {
  background: #126b68;
  margin-left: 35px;
}

.assistant {
  margin-right: 35px;
}

.controls {
  display: flex;
  gap: 10px;
  margin-top: 15px;
}

#question {
  flex: 1;
  min-width: 0;
  background: #edf2f7;
  color: #101827;
  outline: none;
}

.counter {
  color: #aab8cc;
  font-size: 13px;
  margin-top: 15px;
}

footer {
  text-align: center;
  color: #8190a5;
  font-size: 12px;
  padding: 20px;
}

@media(max-width: 600px) {
  header {
    padding: 0 15px;
  }

  .logo {
    font-size: 21px;
  }

  main {
    margin: 20px auto;
  }

  h1 {
    font-size: 27px;
  }

  .controls {
    flex-wrap: wrap;
  }

  #question {
    flex-basis: 100%;
  }

  .user {
    margin-left: 10px;
  }

  .assistant {
    margin-right: 10px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">TurkishAI</div>

  <div class="header-right">
    <select id="language">
      <option value="tr">Türkçe</option>
      <option value="en">English</option>
    </select>

    <button class="new-chat" id="newChat">
      Yeni Sohbet
    </button>
  </div>
</header>

<main>

  <h1 id="title">Nasıl yardımcı olabilirim?</h1>

  <p class="subtitle" id="subtitle">
    TurkishAI ile fikirlerini keşfet.
  </p>

  <div class="chat-container">

    <div id="chat">
      <div class="message assistant" id="welcome">
        Merhaba! TurkishAI'ye hoş geldin.
        Sana nasıl yardımcı olabilirim?
      </div>
    </div>

    <div class="controls">
      <input
        id="question"
        type="text"
        placeholder="Bir mesaj yaz..."
      >

      <button id="send">Gönder</button>
    </div>

    <div class="counter" id="counter">
      Toplam mesaj: 0
    </div>

  </div>

</main>

<footer>
  TurkishAI © 2026 | İlk Sürüm
</footer>

<script>

let language = "tr";
let messageCount = 0;

const chat = document.getElementById("chat");
const input = document.getElementById("question");
const sendButton = document.getElementById("send");
const languageSelect = document.getElementById("language");

function updateCounter() {
  document.getElementById("counter").textContent =
    language === "tr"
      ? "Toplam mesaj: " + messageCount
      : "Total messages: " + messageCount;
}

function addMessage(text, type) {
  const message = document.createElement("div");

  message.className = "message " + type;
  message.textContent = text;

  chat.appendChild(message);
  chat.scrollTop = chat.scrollHeight;
}

function sendMessage() {

  const value = input.value.trim();

  if (value === "") return;

  addMessage(value, "user");

  const reply = language === "tr"
    ? "Mesajını aldım! Şu anda TurkishAI'nin ilk sürümünü kullanıyorsun. Gerçek yapay zekâ bağlantısı henüz eklenmedi."
    : "I received your message! You are using the first version of TurkishAI. The real AI connection has not been added yet.";

  addMessage(reply, "assistant");

  messageCount++;

  updateCounter();

  input.value = "";
  input.focus();
}

function newChat() {

  chat.innerHTML = "";

  const welcome = language === "tr"
    ? "Yeni sohbet başladı. Sana nasıl yardımcı olabilirim?"
    : "A new chat has started. How can I help you?";

  addMessage(welcome, "assistant");

  messageCount = 0;
  updateCounter();
}

function changeLanguage() {

  language = languageSelect.value;

  document.getElementById("title").textContent =
    language === "tr"
      ? "Nasıl yardımcı olabilirim?"
      : "How can I help you?";

  document.getElementById("subtitle").textContent =
    language === "tr"
      ? "TurkishAI ile fikirlerini keşfet."
      : "Explore your ideas with TurkishAI.";

  input.placeholder =
    language === "tr"
      ? "Bir mesaj yaz..."
      : "Write a message...";

  sendButton.textContent =
    language === "tr" ? "Gönder" : "Send";

  document.getElementById("newChat").textContent =
    language === "tr" ? "Yeni Sohbet" : "New Chat";

  newChat();
}

sendButton.addEventListener("click", sendMessage);

input.addEventListener("keydown", function(event) {
  if (event.key === "Enter") {
    sendMessage();
  }
});

document.getElementById("newChat")
  .addEventListener("click", newChat);

languageSelect.addEventListener("change", changeLanguage);

</script>

</body>
</html>
