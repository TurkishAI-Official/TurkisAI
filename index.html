
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TurkishAI</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #101827;
      color: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .app {
      width: 100%;
      max-width: 700px;
      background: #1b2940;
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 15px 50px #0005;
    }
    h1 { color: #62d6c5; margin-bottom: 8px; }
    .subtitle { color: #aab8cc; }
    #chat {
      height: 330px;
      overflow-y: auto;
      margin: 24px 0;
      padding: 14px;
      background: #111c2d;
      border-radius: 12px;
    }
    .message {
      padding: 12px;
      margin: 10px 0;
      border-radius: 10px;
      background: #293b55;
      line-height: 1.5;
      white-space: pre-wrap;
    }
    .user { background: #126b68; }
    .controls { display: flex; gap: 10px; }
    input {
      flex: 1;
      min-width: 0;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      background: #edf2f7;
      font-size: 16px;
    }
    button {
      border: 0;
      border-radius: 10px;
      padding: 14px 20px;
      background: #62d6c5;
      color: #10202a;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover { background: #8ce9dc; }
    .note { color: #9eacc0; font-size: 12px; margin-top: 16px; }
  </style>
</head>
<body>
  <main class="app">
    <h1>TurkishAI</h1>
    <div class="subtitle">Yeni nesil yapay zekâ asistanın.</div>

    <div id="chat">
      <div class="message">
        Merhaba! Ben TurkishAI. Sana nasıl yardımcı olabilirim?
      </div>
    </div>

    <div class="controls">
      <input id="question" placeholder="Bir şey sor..." />
      <button onclick="sendMessage()">Gönder</button>
    </div>

    <div class="note">
      TurkishAI ön sürümüdür. Henüz gerçek yapay zekâ bağlantısı yoktur.
    </div>
  </main>

  <script>
    function sendMessage() {
      const input = document.getElementById("question");
      const chat = document.getElementById("chat");
      const question = input.value.trim();

      if (!question) return;

      const message = document.createElement("div");
      message.className = "message user";
      message.textContent = question;
      chat.appendChild(message);

      const reply = document.createElement("div");
      reply.className = "message";
      reply.textContent = "Mesajını aldım! Gerçek yapay zekâ bağlantısını bir sonraki aşamada ekleyeceğiz.";
      chat.appendChild(reply);

      input.value = "";
      chat.scrollTop = chat.scrollHeight;
    }

    document.getElementById("question").addEventListener("keydown", function(event) {
      if (event.key === "Enter") sendMessage();
    });
  </script>
</body>
</html>
